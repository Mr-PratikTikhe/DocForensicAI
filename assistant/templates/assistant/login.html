{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocForensic AI · Private beta</title>
  <link rel="stylesheet" href="{% static 'assistant/css/app.css' %}">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; background: #1e1e1c; color: #d8cbb3; font-family: Inter, system-ui, sans-serif; }
    .gate { width: min(420px, calc(100% - 40px)); padding: 36px; border: 1px solid #55534e; border-radius: 18px; background: #272724; box-sizing: border-box; }
    .gate h1 { margin: 0 0 8px; font-size: 26px; }
    .gate p { color: #aaa79f; line-height: 1.55; }
    .gate label { display: block; margin: 24px 0 8px; }
    .gate input { width: 100%; padding: 13px; box-sizing: border-box; border: 1px solid #77736a; border-radius: 9px; background: #1e1e1c; color: #f5efe3; }
    .gate button { width: 100%; margin-top: 16px; padding: 13px; border: 0; border-radius: 9px; background: #d8cbb3; color: #1e1e1c; font-weight: 700; cursor: pointer; }
    .error { color: #ff9b9b !important; }
  </style>
</head>
<body>
  <main class="gate">
    <h1>DocForensic AI</h1>
    <p>This workspace is in a private beta. Enter the access password to continue.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <label for="password">Beta password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
