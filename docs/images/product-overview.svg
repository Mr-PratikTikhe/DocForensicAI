<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">DocForensic AI document intelligence workspace</title>
  <desc id="desc">Charcoal interface illustration showing selected documents, a cited answer, and a page viewer in a sand and silver palette.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#292925"/><stop offset="1" stop-color="#1E1E1C"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D8CBB3"/><stop offset="1" stop-color="#BEB5A5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <circle cx="1040" cy="45" r="220" fill="#D8CBB3" opacity=".035"/>
  <path d="M48 48h34l17 30H31z" fill="none" stroke="#D8CBB3" stroke-width="4" stroke-linejoin="round"/>
  <path d="M48 68h34" stroke="#D8CBB3" stroke-width="4" stroke-linecap="round"/>
  <text x="117" y="66" fill="#EEECE6" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">DocForensic AI</text>
  <text x="48" y="144" fill="#D8CBB3" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3">DOCUMENT INTELLIGENCE WORKSPACE</text>
  <text x="48" y="196" fill="#F1EEE8" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="700">Find the evidence.</text>
  <text x="48" y="241" fill="#F1EEE8" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="700">Understand the document.</text>
  <text x="48" y="283" fill="#BEBBB3" font-family="Segoe UI,Arial,sans-serif" font-size="16">Ask grounded questions, compare papers, and study from your sources.</text>
  <g filter="url(#shadow)">
