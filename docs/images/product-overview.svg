    <circle cx="78" cy="355" r="6" fill="#B7C7B5"/>
    <text x="96" y="351" fill="#EEECE6" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Page-level citations</text>
    <text x="96" y="369" fill="#96948D" font-family="Segoe UI,Arial,sans-serif" font-size="11">Trace answers to passages</text>
    <rect x="281" y="326" width="200" height="58" rx="13" fill="#363631" stroke="#D8CBB3" stroke-opacity=".5"/>
    <circle cx="311" cy="355" r="6" fill="#D8CBB3"/>
    <text x="329" y="351" fill="#EEECE6" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Interactive study</text>
    <text x="329" y="369" fill="#96948D" font-family="Segoe UI,Arial,sans-serif" font-size="11">Quizzes and flashcards</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="600" y="72" width="548" height="306" rx="19" fill="#252522" stroke="#55534B"/>
    <rect x="600" y="72" width="548" height="44" rx="19" fill="#33332F"/>
    <path d="M600 97v19h548V97" fill="#33332F"/>
    <circle cx="626" cy="94" r="5" fill="#D8CBB3"/><circle cx="645" cy="94" r="5" fill="#8E8C85"/><circle cx="664" cy="94" r="5" fill="#686761"/>
    <text x="697" y="99" fill="#CAC7BF" font-family="Segoe UI,Arial,sans-serif" font-size="12">Selected documents · grounded chat</text>
    <rect x="620" y="136" width="150" height="222" rx="11" fill="#2E2E2A" stroke="#47463F"/>
    <text x="638" y="162" fill="#D8CBB3" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1">MY DOCUMENTS</text>
    <rect x="639" y="184" width="12" height="12" rx="3" fill="#D8CBB3"/><path d="m642 190 3 3 6-7" fill="none" stroke="#252522" stroke-width="1.7"/>
    <text x="660" y="194" fill="#E5E2DA" font-family="Segoe UI,Arial,sans-serif" font-size="11">relativity.pdf</text>
    <rect x="639" y="215" width="12" height="12" rx="3" fill="#D8CBB3"/><path d="m642 221 3 3 6-7" fill="none" stroke="#252522" stroke-width="1.7"/>
    <text x="660" y="225" fill="#E5E2DA" font-family="Segoe UI,Arial,sans-serif" font-size="11">research-notes.pdf</text>
    <text x="638" y="270" fill="#96948D" font-family="Segoe UI,Arial,sans-serif" font-size="10">INDEX STATUS</text>
    <text x="638" y="291" fill="#B7C7B5" font-family="Segoe UI,Arial,sans-serif" font-size="11">Ready to query</text>
    <rect x="788" y="136" width="338" height="146" rx="12" fill="#30302C" stroke="#4D4B44"/>
    <text x="808" y="162" fill="#D8CBB3" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">DOCFORENSIC ASSISTANT</text>
    <text x="808" y="193" fill="#E7E4DC" font-family="Segoe UI,Arial,sans-serif" font-size="13">The text describes simultaneity as dependent</text>
    <text x="808" y="214" fill="#E7E4DC" font-family="Segoe UI,Arial,sans-serif" font-size="13">on the observer’s frame of reference.</text>
    <rect x="808" y="234" width="104" height="25" rx="7" fill="#4B483F"/>
    <text x="820" y="251" fill="#E9DDC8" font-family="Segoe UI,Arial,sans-serif" font-size="10">Source · Page 18</text>
    <rect x="788" y="297" width="338" height="61" rx="12" fill="#292925" stroke="#47463F"/>
    <text x="808" y="322" fill="#A9A69E" font-family="Segoe UI,Arial,sans-serif" font-size="11">Ask about the selected documents…</text>
    <circle cx="1092" cy="328" r="14" fill="url(#sand)"/>
    <path d="m1086 328 5 5 8-10" fill="none" stroke="#252522" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
